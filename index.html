<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Season 66">
<meta name="theme-color" content="#1b1f3a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1f0fa" media="(prefers-color-scheme: light)">
<title>Season 66</title>
<style>
:root{
  --bg:#1b1f3a; --surface:#262b50; --line:#373d6c; --text:#f3f1ff; --muted:#a9add4;
  --accent:#b9a8ff; --ink:#1b1f3a; --warn:#ff9d8a;
  --body:#ff7a59; --piano:#ffd23f; --french:#5cc8ff; --deep:#5ee0a0; --disc:#b9a8ff;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f1f0fa; --surface:#ffffff; --line:#d9d7ee; --text:#1b1f3a; --muted:#5f6389; --accent:#6a55e0; --warn:#c2412a; --disc:#8f7bf0}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,sans-serif;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 92px);max-width:540px;margin:0 auto}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;margin:26px 0 10px;font-weight:700}
p{margin:0 0 10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:10px}
button{font:inherit;font-weight:700;color:var(--text);background:var(--surface);border:0;border-radius:14px;padding:10px 14px;min-height:46px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:var(--ink)}
@media (prefers-color-scheme: light){button.primary{color:#fff}}
button.quiet{background:transparent;color:var(--accent);padding:6px 0;min-height:44px}
button.plain{background:var(--bg)}
button.danger{color:var(--warn);background:var(--bg)}
button:disabled{opacity:.4}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:46px;width:100%}
textarea{min-height:100px;font-size:12px;font-family:ui-monospace,Menlo,monospace}

/* Today */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .day{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em}
.top .day span{font-size:18px;font-weight:600;color:var(--muted)}
.top .lvl{text-align:right;line-height:1.25}
.top .lvl b{font-size:20px;display:block}
.track{display:flex;align-items:flex-end;gap:2px;height:34px;margin:16px 0 12px}
.track i{flex:1;border-radius:2px;background:var(--line);height:5px;min-width:0}
.track i.done{background:var(--accent)}
.track i.now{background:var(--text);height:34px!important}
.tally{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px}
.tally div{line-height:1.2}
.tally b{font-size:20px;display:block}
.tally .risk b{color:var(--warn)}
.lane{position:relative;height:78px;border-radius:20px;background:var(--surface);overflow:hidden;margin-bottom:10px;--c:var(--accent)}
.lane.body{--c:var(--body)} .lane.piano{--c:var(--piano)} .lane.french{--c:var(--french)} .lane.deep{--c:var(--deep)}
.l-base,.l-fill{position:absolute;inset:0;display:flex;align-items:center;padding:0 76px 0 18px}
.l-fill{background:var(--c);color:var(--ink);clip-path:inset(0 calc(100% - var(--p)) 0 0);transition:clip-path .35s ease}
.l-in{min-width:0}
.l-name{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-sub{font-size:14px;font-weight:600;opacity:.8;white-space:nowrap}
.l-notch{position:absolute;top:0;width:2px;height:9px;background:var(--bg);opacity:.7;z-index:1}
.l-hit{position:absolute;inset:0;z-index:2;background:transparent;border-radius:0;min-height:0;padding:0}
.l-hit:active{transform:none}
.l-go{position:absolute;right:14px;top:50%;margin-top:-25px;z-index:3;width:50px;height:50px;min-height:0;padding:0;border-radius:50%;
  background:var(--ink);color:#fff;font-size:17px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--c)}
.l-go:active{transform:scale(.92)}
.lane.run .l-go{background:#fff;color:var(--ink)}
.lane.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.025)}}
.panel{background:var(--surface);border-radius:18px;padding:14px;margin:-4px 0 12px}
.panel .ctl{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin-top:10px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.tiles.n4,.tiles.n2{grid-template-columns:repeat(2,1fr)} .tiles.n1{grid-template-columns:1fr}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:18px;min-height:96px;font-weight:700;line-height:1.2}
.tile .dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--ink)}
.tile.on{background:var(--disc);color:var(--ink)}
.tile.on .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.tile small{font-weight:600;opacity:.75;font-size:13px}
.banner{background:var(--surface);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}

/* Stats */
.attr{display:grid;grid-template-columns:86px 1fr 46px;gap:10px;align-items:center;padding:9px 0}
.attr b{font-weight:800}
.attr .bar{height:14px;border-radius:99px;background:var(--bg);overflow:hidden}
.attr .bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.attr span{text-align:right;font-weight:700}
.cal{display:grid;grid-template-columns:34px repeat(7,1fr);gap:5px;align-items:center}
.cal .wk{font-size:12px;color:var(--muted);font-weight:600}
.cal button{aspect-ratio:1;min-height:0;padding:0;border-radius:9px;background:var(--bg);position:relative;overflow:hidden}
.cal button i{position:absolute;inset:0;background:var(--accent)}
.cal button.sel{outline:3px solid var(--text);outline-offset:1px}
.cal button.now{box-shadow:inset 0 0 0 2px var(--text)}
.cal button:disabled{opacity:.35}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.key span{display:inline-flex;align-items:center;gap:6px}

/* Review */
.wk-nav button{width:46px;padding:0;font-size:20px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0}
.qrow b{font-weight:700;font-size:15px;line-height:1.2}
.sq{display:flex;gap:4px}
.sq i,.key i{width:20px;height:20px;border-radius:6px;display:block;border:2px solid var(--line)}
.key i{width:14px;height:14px;border-radius:4px}
.sq i.full,.key i.full{background:var(--c);border-color:var(--c)}
.sq i.floor,.key i.floor{border-color:var(--c);background:linear-gradient(135deg,var(--c) 50%,transparent 50%)}
.sq i.none{border-style:dotted;opacity:.5}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.three .card{margin:0;padding:12px 14px}
.three b{font-size:22px;display:block;line-height:1.1}

/* Setup */
fieldset{border:0;border-radius:18px;background:var(--surface);padding:6px 16px 8px;margin:0 0 12px}
legend{font-weight:800;padding:0;float:left;width:100%;margin:10px 0 2px}
legend+*{clear:both}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
legend+.opt,.opt.first{border-top:0}
.opt input[type=checkbox],.opt input[type=radio]{width:24px;height:24px;accent-color:var(--accent);flex:none;margin:0}
.opt label{flex:1}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px 0}
.days7 label{display:block;text-align:center;font-size:13px;font-weight:700;padding:11px 0;border-radius:10px;background:var(--bg)}
.days7 input{position:absolute;opacity:0}
.days7 input:checked+label{background:var(--accent);color:var(--ink)}
.days7 input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.pv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pv:first-child{border-top:0}
.pv i{width:12px;height:12px;border-radius:4px;background:var(--c);display:inline-block;margin-right:8px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav[hidden]{display:none}
nav button{background:transparent;color:var(--muted);font-size:14px;padding:8px 2px;border-radius:12px}
nav button.on{color:var(--ink);background:var(--accent)}
@media (prefers-color-scheme: light){nav button.on{color:#fff}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:99px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden>
  <button data-act="view" data-v="today">Today</button>
  <button data-act="view" data-v="stats">Stats</button>
  <button data-act="view" data-v="review">Review</button>
  <button data-act="view" data-v="settings">Settings</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>

'use strict';
/* ---------- constants ---------- */
var KEY='season66.v1', LEN=66;
var XP={full:30,floor:15,found:10,penBig:15,penFound:5,level:300,statLevel:150};
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var AREAS={
  body:{name:'Body',stat:'Body',pick:'Training sessions and eating to plan'},
  piano:{name:'Piano',stat:'Music',pick:'Daily practice'},
  french:{name:'French',stat:'French',pick:'Daily study and speaking'},
  deep:{name:'Deep work',stat:'Work',pick:'A focused block on one project'}
};
var FOUNDS={
  wake:{pick:'Fixed wake time'},
  light:{pick:'Morning light',sub:'10 minutes outside within an hour of waking'},
  screen:{pick:'Screen limit'},
  read:{pick:'Reading'},
  calm:{pick:'Downshift',sub:'5 minutes of slow breathing, after training or before bed'},
  sleep:{pick:'Sleep cutoff'}
};
var FORDER=['wake','light','screen','read','calm','sleep'];
var SCREEN={
  social30:'Social media under 30 min',
  social60:'Social media under 60 min',
  first:'No phone for the first hour awake',
  after:'Phone down 30 min before bed'
};
var PEN={xp:'Lose XP',level:'Drop a level',streak:'Streak reset only'};

/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function today(){return ymd(new Date())}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function nice(s){var d=parse(s);return WD[d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- storage ---------- */
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}

/* ---------- state ---------- */
var S=load();
var view='today', viewDate=null, reviewWeek=null;
var A={ // questionnaire answers (defaults = the answers given when this app was designed)
  areas:['body','piano','french','deep'], founds:['light','screen','read','calm','sleep'],
  block:90, floor:true, penalty:'xp', rest:[3,0],
  deepMode:'rotate', deepProject:'', screenRule:'social60',
  bedtime:'22:00', wake:'06:00', pages:20, start:today()
};

/* ---------- questionnaire -> quests ---------- */
function derive(a){
  var block=Math.max(15,Math.round(+a.block/15)*15||90), half=block/2;
  var sit=block>=90?Math.round(block/3):half;
  var notes={
    body:'Training session. Eating to plan is part of passing.',
    piano:block>=60?('Split into sittings of '+sit+' min.'):'One focused sitting.',
    french:half+' min input (listening, reading), '+half+' min output (speaking, writing).',
    deep:'One unbroken block.'
  };
  var big=a.areas.filter(function(id){return AREAS[id]}).map(function(id){
    return {id:id,name:AREAS[id].name,stat:AREAS[id].stat,note:notes[id]};
  });
  var found=FORDER.filter(function(id){return a.founds.indexOf(id)>=0})
    .map(function(id){return {id:id,name:foundName(a,id)}});
  return {start:a.start,length:LEN,block:block,floor:a.floor?half:0,penalty:PEN[a.penalty]?a.penalty:'xp',
    rest:a.rest.map(Number),deepMode:a.deepMode,deepProject:a.deepProject||'',big:big,found:found};
}
function foundName(a,id){
  return {wake:'Up by '+(a.wake||'06:00'), light:'10 min morning light', screen:SCREEN[a.screenRule]||SCREEN.social60,
    read:'Read '+(+a.pages||20)+' pages', calm:'5 min slow breathing', sleep:'In bed by '+(a.bedtime||'22:00')}[id];
}
// a foundation added mid-season carries a "from" date and only counts from that day
function active(q,d){return !q.from||d>=q.from}
function maxDay(c,d){return c.big.length*XP.full+c.found.filter(function(q){return !d||active(q,d)}).length*XP.found}

/* ---------- scoring ---------- */
function rec(d){return S.days[d]||{big:{},found:{}}}
function bigState(c,d,id){
  var m=(rec(d).big||{})[id]||0;
  return m>=c.block?'full':(c.floor&&m>=c.floor?'floor':'miss');
}
function scoreDay(d,fin){
  var c=S.config,r=rec(d),gain=0,pen=0,miss=0,per={},allFull=c.big.length>0;
  c.big.forEach(function(q){
    var st=bigState(c,d,q.id),g=st==='full'?XP.full:st==='floor'?XP.floor:0;
    if(st!=='full')allFull=false;
    if(st==='miss'){miss++;if(fin&&c.penalty==='xp')pen+=XP.penBig}
    gain+=g;per[q.id]={st:st,gain:g};
  });
  c.found.forEach(function(q){
    if(!active(q,d)){per[q.id]={st:'none',gain:0};return}
    var on=!!(r.found||{})[q.id];
    if(on)gain+=XP.found;else{miss++;if(fin&&c.penalty==='xp')pen+=XP.penFound}
    per[q.id]={st:on?'full':'miss',gain:on?XP.found:0};
  });
  if(fin&&c.penalty==='level'&&miss>0)pen=XP.level;
  return {gain:gain,pen:pen,miss:miss,per:per,allFull:allFull,max:maxDay(c,d)};
}
function endDate(){return addDays(S.config.start,S.config.length-1)}
function season(){
  var c=S.config,t=today(),end=endDate(),last=t<end?t:end;
  var o={xp:0,streak:0,best:0,perfect:0,stats:{},days:[],max:maxDay(c,last),end:end,over:t>end,pre:t<c.start};
  c.big.forEach(function(q){o.stats[q.stat]=0});
  if(c.found.length)o.stats.Discipline=0;
  for(var d=c.start;d<=last;d=addDays(d,1)){
    var fin=d<t,r=scoreDay(d,fin);
    o.xp=Math.max(0,o.xp+r.gain-r.pen);
    c.big.forEach(function(q){o.stats[q.stat]+=r.per[q.id].gain});
    c.found.forEach(function(q){o.stats.Discipline+=r.per[q.id].gain});
    if(r.allFull){o.streak++;if(o.streak>o.best)o.best=o.streak}else if(fin)o.streak=0;
    if(r.gain===r.max)o.perfect++;
    r.d=d;r.fin=fin;o.days.push(r);
  }
  o.level=Math.floor(o.xp/XP.level);
  return o;
}
function dayNo(d){return diff(d,S.config.start)+1}
function weekOf(d){return Math.ceil(dayNo(d)/7)}
function projectFor(d){
  var c=S.config;
  if(c.deepMode!=='rotate')return c.deepProject;
  return (S.weeks||{})[weekOf(d)]||'';
}
function isRest(d){return S.config.rest.indexOf(parse(d).getDay())>=0}
function editable(d){
  var t=today(),c=S.config;
  if(d<c.start||d>endDate())return false;
  if(d===t)return true;
  return d===addDays(t,-1)&&new Date().getHours()<12;
}

/* ---------- views ---------- */
var openQ=null, selDay=null, popQ=null;
function $(s){return document.querySelector(s)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}
function mins(d,id){return (rec(d).big||{})[id]||0}
function shortName(q){
  return q.name.replace('Social media under','Social ≤').replace('Read ','').replace('In bed by','Bed by')
    .replace('10 min morning light','Morning light').replace('5 min slow breathing','Slow breathing').replace('No phone for the first hour awake','No phone, first hour').replace('Phone down 30 min before bed','Phone down early');
}
function colorOf(id){return AREAS[id]?'var(--'+id+')':'var(--disc)'}
function fmtClock(ms){var s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return (m>=60?Math.floor(m/60)+':'+pad(m%60):m)+':'+pad(s%60)}
function running(id,d){return S.timer&&S.timer.q===id&&S.timer.d===d}
function atRisk(d){
  var c=S.config,r=scoreDay(d,true);
  return r.pen;
}

function render(){
  var nav=$('#nav');
  if(!S){nav.hidden=true;$('#app').innerHTML=vSetup();updatePreview();return}
  nav.hidden=false;
  [].forEach.call(nav.querySelectorAll('button'),function(b){
    var on=b.dataset.v===view;b.classList.toggle('on',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  $('#app').innerHTML=view==='stats'?vStats():view==='review'?vReview():view==='settings'?vSettings():vToday();
  popQ=null;tick();
}

function check(name,val,on,label,sub){
  var id=name+'-'+val;
  return '<div class="opt"><input type="checkbox" id="'+id+'" name="'+name+'" value="'+val+'"'+(on?' checked':'')+'>'+
    '<label for="'+id+'">'+label+(sub?'<br><span class="muted small">'+sub+'</span>':'')+'</label></div>';
}
function radio(name,val,on,label,sub){
  var id=name+'-'+val;
  return '<div class="opt"><input type="radio" id="'+id+'" name="'+name+'" value="'+val+'"'+(on?' checked':'')+'>'+
    '<label for="'+id+'">'+label+(sub?'<br><span class="muted small">'+sub+'</span>':'')+'</label></div>';
}
function vSetup(){
  var h='<h1>Season 66</h1><p class="muted" style="margin:8px 0 18px">Eight questions. Your answers become the daily quests, and they lock when the season starts.</p><form id="setup">';
  h+='<fieldset><legend>Which skills level up this season?</legend>';
  Object.keys(AREAS).forEach(function(k){h+=check('areas',k,A.areas.indexOf(k)>=0,AREAS[k].name,AREAS[k].pick)});
  h+='</fieldset><fieldset><legend>Which foundations are enforced daily?</legend>';
  Object.keys(FOUNDS).forEach(function(k){h+=check('founds',k,A.founds.indexOf(k)>=0,FOUNDS[k].pick,FOUNDS[k].sub)});
  h+='</fieldset><fieldset><legend>How long is each skill block?</legend><div class="opt"><select name="block" aria-label="Minutes per skill block">';
  [30,45,60,90,120].forEach(function(n){h+='<option value="'+n+'"'+(A.block==n?' selected':'')+'>'+n+' minutes each</option>'});
  h+='</select></div>'+check('floor','1',A.floor,'Allow a floor','Half the block earns half XP and avoids the penalty, but does not count toward the streak.')+'</fieldset>';
  h+='<fieldset><legend>What does a missed quest cost?</legend>'+
    radio('penalty','xp',A.penalty==='xp','Lose XP','A missed skill costs '+XP.penBig+', a missed foundation costs '+XP.penFound+'.')+
    radio('penalty','level',A.penalty==='level','Drop a level','Any miss in a day costs '+XP.level+' XP.')+
    radio('penalty','streak',A.penalty==='streak','Streak reset only','XP is never deducted.')+'</fieldset>';
  h+='<fieldset><legend>Which days are Body recovery days?</legend><p class="muted small" style="margin:0">Walking and mobility replace the training session.</p><div class="days7">';
  [1,2,3,4,5,6,0].forEach(function(i){h+='<div><input type="checkbox" id="rest-'+i+'" name="rest" value="'+i+'"'+(A.rest.indexOf(i)>=0?' checked':'')+'><label for="rest-'+i+'">'+WD[i]+'</label></div>'});
  h+='</div></fieldset>';
  h+='<fieldset><legend>What does deep work serve?</legend>'+

function lane(q,d,can,isToday){
  var c=S.config,logged=mins(d,q.id),run=running(q.id,d);
  var live=logged+(run?Math.floor((Date.now()-S.timer.t)/60000):0);
  var st=live>=c.block?'full':(c.floor&&live>=c.floor?'floor':'miss');
  var title=q.name,pr;

  if(q.id==='body'&&isRest(d))title='Body, recovery';
  var sub=run?'<span data-clock></span> running, '+live+' of '+c.block+' min':
    st==='full'?c.block+' min done, +'+XP.full+' XP':
    live+' of '+c.block+' min'+(st==='floor'?', floor reached':'');
  var inner='<div class="l-in"><div class="l-name">'+title+'</div><div class="l-sub num">'+sub+'</div></div>';
  var open=openQ===q.id;

  if(can&&isToday){

      '<button class="l-go" data-act="timer" data-q="'+q.id+'" aria-label="'+(run?'Stop':'Start')+' '+q.name+' timer">'+(run?'■':'▶')+'</button>';

function weekRange(w){
  var c=S.config,a=addDays(c.start,(w-1)*7),b=addDays(a,6),end=endDate();
  return {a:a,b:b>end?end:b};
}
function weekData(w){
  var c=S.config,t=today(),wr=weekRange(w),o={gain:0,pen:0,max:0,n:0,q:{},seq:{}};
  c.big.concat(c.found).forEach(function(q){o.q[q.id]={full:0,floor:0,miss:0,none:0};o.seq[q.id]=[]});
  for(var d=wr.a;d<=wr.b;d=addDays(d,1)){
    if(d>t){Object.keys(o.seq).forEach(function(id){o.seq[id].push('none')});continue}
    var r=scoreDay(d,d<t);o.gain+=r.gain;o.pen+=r.pen;o.max+=r.max;o.n++;
    Object.keys(r.per).forEach(function(id){o.q[id][r.per[id].st]++;o.seq[id].push(r.per[id].st)});
  }
  return o;
}
function weakest(se){
  var sum=[0,0,0,0,0,0,0],cnt=[0,0,0,0,0,0,0],n=0;
  se.days.forEach(function(r){if(r.fin){var w=parse(r.d).getDay();sum[w]+=r.gain;cnt[w]++;n++}});
  if(n<7)return null;
  var best=null;
  for(var i=0;i<7;i++)if(cnt[i]){var a=sum[i]/cnt[i];if(!best||a<best.avg)best={day:WDL[i],avg:Math.round(a)}}
  return best;
}

    '. Level '+se.level+', streak '+se.streak+'. '+parts.concat(f).join(', ')+'.'+(wk?' Weakest day: '+wk.day+'.':'');
}

function ensure(d){if(!S.days[d])S.days[d]={big:{},found:{}};if(!S.days[d].big)S.days[d].big={};if(!S.days[d].found)S.days[d].found={};return S.days[d]}

  }
  if(!S)return;
  if(act==='view'){view=b.dataset.v;openQ=null;render();window.scrollTo(0,0);return}
  if(act==='date'){viewDate=b.dataset.d;openQ=null;render();return}
  if(act==='open'){openQ=openQ===q?null:q;render();return}
  if(act==='day'){selDay=selDay===b.dataset.d?null:b.dataset.d;render();return}
  if(act==='timer'){
    if(d!==today())return;
    if(running(q,d)){
      var got;change(function(){got=stopTimer()},q);
      if(!got)toast('Under a minute, nothing logged');
      return;
    }
    change(function(){stopTimer();S.timer={q:q,d:d,t:Date.now()}},q);return;
  }
  if(act==='add'||act==='full'){
    if(!editable(d))return;
    change(function(){
      var r=ensure(d),m=r.big[q]||0;
      r.big[q]=act==='full'?Math.max(m,c.block):Math.max(0,m+ +b.dataset.n);
    },q);return;
  }
  if(act==='found'){
    if(!editable(d))return;
    change(function(){var f=ensure(d);f.found[q]=!f.found[q]});return;
  }
  if(act==='addfound'){
    var ids=[].map.call(document.querySelectorAll('[name=addf]:checked'),function(x){return x.value})
      .filter(function(id){return FOUNDS[id]&&!c.found.some(function(q){return q.id===id})});
    if(!ids.length){toast('Tick at least one foundation');return}
    var t0=today(),an=S.answers||A;
    ids.forEach(function(id){
      var q={id:id,name:foundName(an,id)};
      if(t0>c.start)q.from=t0;
      c.found.push(q);
      if(S.answers&&S.answers.founds&&S.answers.founds.indexOf(id)<0)S.answers.founds.push(id);
    });
    c.found.sort(function(a,b){return FORDER.indexOf(a.id)-FORDER.indexOf(b.id)});
    save();render();toast(ids.length+(ids.length>1?' foundations':' foundation')+' added from today');return;
  }
  if(act==='week'){reviewWeek+= +b.dataset.n;render();return}
  if(act==='proj'){
    if(!S.weeks)S.weeks={};
    S.weeks[reviewWeek]=$('#proj').value.trim();save();toast('Project saved for week '+reviewWeek);render();return;
  }
  if(act==='copysum'){copy(summary(reviewWeek),'Summary copied');return}
  if(act==='copydata'){copy(JSON.stringify(S),'Backup copied');return}
  if(act==='export'){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    a.download='season66-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();return;
  }
  if(act==='import'){
    try{
      var x=JSON.parse($('#imp').value);
      if(!x||!x.config||!x.config.big||!x.days)throw 0;
      S=x;save();view='today';viewDate=null;render();toast('Backup restored');
    }catch(err){toast('That text is not a Season 66 backup')}
    return;
  }
  if(act==='reset'){
    if($('#rst').value.trim()!=='RESET'){toast('Type RESET to confirm');return}
    if(S.answers){A=S.answers;A.start=today()}
    S=null;try{localStorage.removeItem(KEY)}catch(err){}
    render();window.scrollTo(0,0);return;
  }
});
function onForm(e){if(e.target.closest&&e.target.closest('#setup')){readForm();updatePreview()}}
document.addEventListener('input',onForm);
document.addEventListener('change',onForm);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S)render()});
setInterval(tick,1000);
render();
</script>
</body>
</html>
